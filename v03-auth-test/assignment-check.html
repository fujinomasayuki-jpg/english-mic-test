<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v0.3 課題一覧・認証済みAPI試験</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#17304a;line-height:1.65}
main{max-width:760px;margin:20px auto;padding:0 16px 28px}
header{background:linear-gradient(115deg,#1e416e,#2775a0);color:#fff;padding:26px;border-radius:17px}
header small{font-weight:700;letter-spacing:.05em}h1{font-size:1.35rem;margin:.4em 0}.panel{margin-top:16px;border:1px solid #d6e0ec;background:#fff;border-radius:14px;padding:20px}
h2{font-size:1.05rem;margin:0 0 12px}button{font:inherit;border:0;border-radius:9px;padding:11px 18px;margin:4px 8px 4px 0;cursor:pointer;background:#1c6096;color:white;font-weight:700}
button.secondary{background:#e8eef6;color:#234361}button:disabled{opacity:.48;cursor:not-allowed}#message{padding:12px;border-radius:9px;background:#e9f0f8;white-space:pre-wrap}#message.error{background:#fff0e6;color:#893c07}#message.success{background:#e4f5eb;color:#13603a}
.meta{background:#edf3fa;border-radius:9px;padding:12px;margin:0 0 12px}#results{margin-top:12px}.result{border:1px solid #d7e1ed;border-radius:9px;padding:13px;margin-top:10px}dt{font-size:.85rem;color:#536b81}dd{margin:0 0 6px;font-weight:650}dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}small.note{display:block;color:#64798d;margin-top:12px}
</style>
</head>
<body>
<main>
<header><small>AI ENGLISH CONVERSATION · v0.3 / UNIT 2-A</small><h1>課題一覧API 接続テスト</h1><div>認証済みの試験受講者だけが、公開課題を確認できるか検証する。</div></header>
<section class="panel"><h2>① 大学Googleアカウントで認証</h2><div class="meta">対象クラス：月曜1限（<code>mon1</code>）<br>対象課題：<code>TEST_UNIT2A_001</code></div><button id="login" disabled>大学Googleアカウントでログイン</button><button id="logout" class="secondary" disabled>ログアウト</button><p id="authState">ログイン状態を確認中…</p></section>
<section class="panel"><h2>② 課題一覧を取得する</h2><button id="check" disabled>課題一覧を確認（無料）</button><div id="message" role="status" aria-live="polite">準備中…</div><div id="results"></div><small class="note">試験画面：録音・AI応答・利用回数の消費は行わない。IDトークンを画面やログには表示せず、このAPIへの認証のみに使用する。</small></section>
<p><a href="./">学生用認証画面に戻る</a></p>
</main>
<script type="module">
import config from './config.mjs';
import { createFirebaseClient, validateStudentConfig } from './firebase-client.mjs';
const byId = id => document.getElementById(id);
const login = byId('login'), logout = byId('logout'), check = byId('check');
const authState = byId('authState'), message = byId('message'), results = byId('results');
let client = null, currentUser = null, busy = false;
function updateControls(){login.disabled=busy || !client || !!currentUser;logout.disabled=busy || !client || !currentUser;check.disabled=busy || !currentUser;}
function report(text,kind=''){message.className=kind;message.textContent=text;}
function clear(){results.replaceChildren();}
function field(dl,label,value){const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=String(value);dl.append(dt,dd);}
function jst(epoch){if(!Number.isFinite(epoch))return '不明';return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(epoch*1000));}
function show(data){
 clear();
 if(!Array.isArray(data.assignments)){report('応答形式が予期した形式ではありません。','error');return;}
 if(data.assignments.length===0){report('認証成功。ただし、このクラスに表示できる課題はありません。','error');return;}
 report(`認証済みAPIから課題一覧を取得しました（${data.assignments.length}件）。`,'success');
 for(const a of data.assignments){const article=document.createElement('article');article.className='result';const h=document.createElement('h2');h.textContent=a.title||'名称なし';const dl=document.createElement('dl');
 field(dl,'課題ID',a.assignmentId??'不明');field(dl,'状態',a.status??'不明');field(dl,'会話数',`${a.turnLimit??'?'}往復`);field(dl,'使用回数',a.sessionsUsed??'?');field(dl,'残り回数',a.sessionsRemaining??'?');field(dl,'達成済み',a.achieved?'YES':'NO');field(dl,'開始（JST）',jst(a.opensAt));field(dl,'終了（JST）',jst(a.closesAt));article.append(h,dl);results.append(article);
 }
}
async function getAssignments(){
 if(!currentUser || busy)return;busy=true;updateControls();clear();report('認証済みAPIへ問い合わせています…');
 try{
  const token=await currentUser.getIdToken();
  const response=await fetch(new URL('/api/student/assignments',config.workerBaseUrl),{
   method:'POST',mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',
   headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
   body:JSON.stringify({class_id:'mon1'})
  });
  const payload=await response.json();
  if(!response.ok || payload?.ok!==true){report(`課題一覧の取得に失敗しました（HTTP ${response.status}、${typeof payload?.code==='string'?payload.code:'UNKNOWN_ERROR'}）。`,'error');return;}
  show(payload);
 }catch{report('通信・認証の処理に失敗しました。ログイン状態とネットワーク接続を確認してください。','error');}
 finally{busy=false;updateControls();}
}
if(!validateStudentConfig(config)){report('接続設定が有効ではありません。','error');authState.textContent='設定未完了';}
else{
 try{
  client=await createFirebaseClient(config);
  client.subscribe(user=>{
   currentUser=user;authState.textContent=user?'大学Googleアカウントでログイン済み。課題一覧を確認できます。':'ログアウト中です。大学Googleアカウントでログインしてください。';
   clear();report(user?'「課題一覧を確認（無料）」を押してください。':'ログイン後に課題を確認できます。');updateControls();
  },()=>{currentUser=null;authState.textContent='認証状態の確認に失敗しました。';report('認証エラーです。','error');updateControls();});
  updateControls();
 }catch{authState.textContent='認証機能を初期化できませんでした。';report('初期化エラーです。','error');}
}
login.addEventListener('click',async()=>{if(!client||busy)return;busy=true;updateControls();try{await client.signIn();}catch{report('ログインが完了しませんでした。再試行してください。','error');}finally{busy=false;updateControls();}});
logout.addEventListener('click',async()=>{if(!client||busy)return;busy=true;updateControls();try{await client.signOut();}catch{report('ログアウトに失敗しました。','error');}finally{busy=false;updateControls();}});
check.addEventListener('click',getAssignments);
</script>
</body>
</html>
